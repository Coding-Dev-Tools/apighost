[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apighost"
version = "0.2.0"
description = "CLI tool that reads an OpenAPI spec and spawns a realistic mock API server with VCR cassette recording and replay"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Revenue Holdings"}]
keywords = ["openapi", "mock", "api", "vcr", "testing", "stub"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Mocking",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "faker>=18.0.0",
    "flask>=3.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "jsonschema>=4.17.0",
    "werkzeug>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Coding-Dev-Tools/apighost"
Documentation = "https://coding-dev-tools.github.io/apighost"
Repository = "https://github.com/Coding-Dev-Tools/apighost"
Issues = "https://github.com/Coding-Dev-Tools/apighost/issues"
Changelog = "https://github.com/Coding-Dev-Tools/apighost/releases"

[project.scripts]
apighost = "apighost.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["*"]
