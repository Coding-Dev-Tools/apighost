openapi: 3.1.0
info:
  title: Xquik API
  version: "1.0"
servers:
  - url: https://xquik.com
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
  schemas:
    TweetSearchResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
              - id
              - text
            properties:
              id:
                type: string
              text:
                type: string
paths:
  /api/v1/x/tweets/search:
    get:
      operationId: searchTweets
      summary: Search recent public posts
      security:
        - apiKey: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TweetSearchResponse"
